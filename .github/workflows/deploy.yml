name: Deploy Sphinx Handbook

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build
        run: |
          sphinx-build -b html source/ build/

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_SERVER }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Strip any accidental whitespace/newlines from secrets
          CLEAN_USER=$(echo "$USER" | xargs)
          CLEAN_HOST=$(echo "$HOST" | xargs)
          set -x

          # Set up key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host key
          echo $USER
          echo $HOST
          ssh-keyscan -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          # Sync using clean variables
          rsync -vvv -avz --delete -e "ssh -i ~/.ssh/deploy_key" build/ "${CLEAN_USER}@${CLEAN_HOST}:/var/www/handbook.opynsim.eu/"

          rm -f ~/.ssh/deploy_key

